<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Water Tracker</title>
  <link rel="icon" href="favicon.jpg" type="image/jpeg">
  <link rel="apple-touch-icon" href="favicon.jpg">
  <!-- Google Fonts for Comic/Handwritten Style -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Fredoka:wght@300..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <!-- Three.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <!-- Background 3D Droplets Canvas -->
  <canvas id="bg-droplets-canvas"></canvas>

  <div class="app-container">
    <!-- Main Neobrutalist Dashboard Card -->
    <div class="dashboard-card">
      
      <!-- Top Neon Header -->
      <header class="main-header">
        <div class="header-content">
          <span class="icon-span">
            <!-- Custom SVG water glass icon -->
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 2H7l-2 18a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2z"/>
              <path d="M5 9h14"/>
            </svg>
          </span>
          <h1>NEON WATER TRACKER</h1>
        </div>
        <button class="settings-btn" id="reset-today-btn" title="Reset Today's Intake">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
            <path d="M21 3v5h-5"/>
            <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
            <path d="M3 21v-5h5"/>
          </svg>
        </button>
      </header>

      <!-- Comic Motivational Speech Bubble -->
      <section class="speech-bubble-section">
        <div class="bubble-arrow"></div>
        <div class="speech-bubble">
          <p id="motivational-quote">
            Welcome back KT, <span class="quote-highlight">"YOUR FUTURE SELF IS EITHER THANKING YOU OR FACEPALMING. DRINK THE WATER."</span>
          </p>
          <button id="next-quote-btn" title="Next Tip">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
            </svg>
          </button>
        </div>
      </section>

      <!-- Main Columns Grid -->
      <div class="dashboard-grid">
        
        <!-- Column 1: Tracker Controls & Stats -->
        <div class="card card-controls">
          <h2 class="card-title">TODAY'S PROGRESS</h2>
          
          <div class="progress-details">
            <div class="stat-box">
              <div class="stat-value" id="water-ml">0 / 2000</div>
              <div class="stat-label">MILLILITRES</div>
            </div>
            
            <div class="stat-box">
              <div class="stat-value" id="water-glasses">0 / 17</div>
              <div class="stat-label">GLASSES (120ml each)</div>
            </div>
          </div>

          <!-- Fill Indicator Bar -->
          <div class="fill-bar-outer">
            <div class="fill-bar-inner" id="progress-bar-fill"></div>
            <span class="fill-percent-label" id="progress-percent">0%</span>
          </div>

          <!-- Stupidity Banner -->
          <div id="stupidity-banner" class="stupidity-banner"></div>

          <div class="btn-group">
            <button class="btn btn-primary" id="btn-add-glass">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" style="margin-right:8px;">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
              DRINK GLASS (+120ml)
            </button>
            <button class="btn btn-secondary" id="btn-remove-glass">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" style="margin-right:8px;">
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
              REMOVE GLASS (-120ml)
            </button>
          </div>
        </div>

        <!-- Column 2: 3D Animated Water Glass Visualizer -->
        <div class="card card-visualizer">
          <h2 class="card-title">3D WATER GLASS</h2>
          <div class="canvas-container">
            <canvas id="glass-3d-canvas"></canvas>
            <div class="floating-tooltip">Drag to rotate the glass!</div>
          </div>
        </div>

        <!-- Column 3: Weekly Scribble Chart -->
        <div class="card card-weekly">
          <h2 class="card-title">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="vertical-align: middle; margin-right: 6px;">
              <line x1="18" y1="20" x2="18" y2="10"></line>
              <line x1="12" y1="20" x2="12" y2="4"></line>
              <line x1="6" y1="20" x2="6" y2="14"></line>
            </svg>
            WEEKLY SCRIBBLE
          </h2>
          <div class="chart-container" id="weekly-chart-container">
            <!-- Custom dynamic SVG bar chart will be injected here -->
          </div>
        </div>

      </div>

      <!-- Bottom Grid Section -->
      <div class="bottom-grid">
        
        <!-- Card 4: Monthly Progress Grid (Calendar) -->
        <div class="card card-monthly-grid">
          <h2 class="card-title">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="vertical-align: middle; margin-right: 6px;">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
            <span id="monthly-grid-title">JULY BOARD</span>
          </h2>
          
          <div class="calendar-controls">
            <button class="nav-month-btn" id="prev-month-btn">&lt;</button>
            <span class="calendar-year-badge" id="calendar-year-label">2026</span>
            <button class="nav-month-btn" id="next-month-btn">&gt;</button>
          </div>

          <div class="calendar-wrapper">
            <div class="calendar-header-row" id="calendar-header-days">
              <!-- Days of week labels (Sun, Mon, etc) -->
            </div>
            <div class="calendar-grid" id="calendar-days-grid">
              <!-- Calendar day boxes -->
            </div>
          </div>
        </div>

        <!-- Card 5: Monthly Progress Chart (Line Chart) -->
        <div class="card card-monthly-chart">
          <h2 class="card-title">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="vertical-align: middle; margin-right: 6px;">
              <path d="M3 3v18h18"></path>
              <path d="M18.7 8l-5.1 5.2-2.8-2.7L7 14.3"></path>
            </svg>
            MONTHLY GRAPH
          </h2>
          <div class="chart-container" id="monthly-chart-container">
            <!-- Custom dynamic SVG line chart will be injected here -->
          </div>
        </div>

      </div>

    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
